      paragraph_1: You are receiving this email because you have requested the deletion of your LibreWeddingPlanner account. Please, click the link at the bottom within 1 hour to effectively delete your account and all associated data (guests, groups, etc.). If the link has expired, you can request another one from the settings page.
      paragraph_2: The slug used for your account and website, (%{slug}), will become available for someone else to pick. Make sure your guests don't need your website anymore (e.g., if it includes an address to send some gifts), as a new user choosing the same slug will have their own website with different information.
      paragraph_3: We appreciate you've used LibreWeddingPlanner, and wholeheartedly hope it was useful to you. If you'd like to share some feedback, drop us a line, or use the issue tracker. Links in the web app footer or the project website.
      confirm_deletion: Confirm deletion
