worker_processes 1;
pid /tmp/together-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  client_body_temp_path /tmp/nginx-client;
  proxy_temp_path /tmp/nginx-proxy;
  server {
    listen __PORT__;
    server_name _;
    root /app/ui;
    client_max_body_size 4m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    location = /up {
      proxy_pass http://127.0.0.1:__RAILS_PORT__/up;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
    }
    # Only Together's supported API is public. Upstream admin, artwork uploads,
    # seating workers, password recovery and Swagger are not exposed.
    location ~ ^/api/(token|google/(config|sign_in)|[a-z0-9-]+/(planner(/(tasks|guests|budget|vendors|events|settings)(/[a-f0-9-]+)?|/(tasks|vendors)/[a-f0-9-]+/documents(/[a-f0-9-]+)?)?|memberships(/[a-f0-9-]+)?|users/sign_out))$ {
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://127.0.0.1:__RAILS_PORT__;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 30s;
    }
    location /api/ { return 404; }
    location = /config.js { add_header Cache-Control no-store; }
    location ~ ^/([a-z0-9-]+)/?$ { return 302 /?wedding=$1; }
    location / { try_files $uri /index.html; }
  }
}
