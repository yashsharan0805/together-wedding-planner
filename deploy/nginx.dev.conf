server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  client_max_body_size 4m;
  add_header X-Content-Type-Options nosniff always;
  # Google's recommended policy for HTTP localhost sign-in testing.
  add_header Referrer-Policy no-referrer-when-downgrade always;
  add_header X-Frame-Options SAMEORIGIN always;

  location /api/ {
    proxy_pass http://backend:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
  }
  # Keep the upstream confirmation links functional for invited co-planners.
  location ~ ^/[^/]+/(users/confirmation|memberships/[^/]+/accept)$ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /letter_opener/ {
    proxy_pass http://backend:3000/letter_opener/;
    proxy_set_header Host $host;
  }
  location ~ ^/([a-z0-9-]+)/?$ {
    return 302 /?wedding=$1;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
