name: Publication security checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Source inventory and archive
        run: |
          python3 scripts/test_source_safety.py
          python3 scripts/package-source.py
          python3 scripts/check-public-source.py
      - name: Scan source, archives and Git history
        env:
          SCANNER: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        run: |
          docker pull "$SCANNER"
          docker run --rm --network none -v "$PWD:/repo:ro" "$SCANNER" dir /repo --redact --max-archive-depth 2 --no-banner
          docker run --rm --network none -v "$PWD:/repo:ro" "$SCANNER" git /repo --redact --log-opts="--all" --no-banner
